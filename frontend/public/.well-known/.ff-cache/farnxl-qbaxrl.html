<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlagFoundry Vault</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, rgba(0,255,65,.14), transparent 24rem), #050607;
      color: #e5fff0;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    main {
      width: min(760px, calc(100vw - 32px));
      border: 1px solid rgba(0,255,65,.28);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(19,31,27,.96), rgba(8,12,11,.96));
      box-shadow: 0 24px 90px rgba(0,0,0,.45);
      padding: 24px;
    }
    h1 { margin: 0 0 8px; color: #00ff41; font-size: 22px; }
    p { color: #adc7ba; line-height: 1.6; }
    form { display: flex; gap: 10px; margin: 20px 0; }
    input, button {
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.45);
      color: #fff;
      padding: 0 12px;
      font: inherit;
    }
    input { flex: 1; }
    button { cursor: pointer; border-color: rgba(0,255,65,.45); color: #00ff41; font-weight: 700; }
    pre {
      display: none;
      max-height: 62vh;
      overflow: auto;
      white-space: pre-wrap;
      border: 1px solid rgba(0,255,65,.22);
      border-radius: 10px;
      background: #020403;
      padding: 16px;
      line-height: 1.5;
    }
    .status { min-height: 24px; color: #ffcf5a; }
  </style>
</head>

    <p>This file is encrypted. Enter the password to decrypt the answer key locally in your browser.</p>
    <form id="form">
      <input id="password" type="password" autocomplete="off" placeholder="Password" autofocus>
      <button>Unlock</button>
    </form>
    <p id="status" class="status"></p>
    <pre id="output"></pre>
  </main>

    function b64(value) {
      return Uint8Array.from(atob(value), char => char.charCodeAt(0));
    }

    async function derive(password) {
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    document.getElementById('form').addEventListener('submit', async event => {
      event.preventDefault();
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      status.textContent = 'Checking password...';
      output.style.display = 'none';
      output.textContent = '';
      try {
        const key = await derive(document.getElementById('password').value);
        const combined = new Uint8Array([...b64(payload.ciphertext), ...b64(payload.tag)]);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(payload.iv), tagLength: 128 }, key, combined);
        output.textContent = new TextDecoder().decode(plain);
        output.style.display = 'block';
        status.textContent = 'Unlocked.';
      } catch {
        status.textContent = 'Wrong password.';
      }
    });
