<svg width="1400" height="680" viewBox="0 0 1400 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="680" fill="#050607"/>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#13201b"/>
      <stop offset="1" stop-color="#080c0b"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#12352b" stroke-opacity=".35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="680" fill="url(#grid)"/>
  <circle cx="120" cy="40" r="260" fill="#38e8ff" opacity=".08"/>
  <circle cx="1220" cy="120" r="260" fill="#ffcf5a" opacity=".06"/>
  <circle cx="710" cy="660" r="330" fill="#00ff41" opacity=".08"/>

  <rect x="0" y="0" width="220" height="680" fill="#020504" opacity=".88"/>
  <rect x="12" y="12" width="196" height="78" rx="8" fill="#063417" stroke="#078d32"/>
  <text x="48" y="38" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="16" font-weight="700">FlagFoundry</text>
  <text x="24" y="62" fill="#a9b8b1" font-family="Inter, Arial, sans-serif" font-size="13">Mission control for hands-on</text>
  <text x="24" y="78" fill="#a9b8b1" font-family="Inter, Arial, sans-serif" font-size="13">security practice.</text>

  <text x="26" y="130" fill="#d8e5df" font-family="Fira Code, Consolas, monospace" font-size="14">Dashboard</text>
  <text x="26" y="170" fill="#d8e5df" font-family="Fira Code, Consolas, monospace" font-size="14">Rooms</text>
  <text x="26" y="210" fill="#d8e5df" font-family="Fira Code, Consolas, monospace" font-size="14">Leaderboard</text>
  <text x="26" y="250" fill="#d8e5df" font-family="Fira Code, Consolas, monospace" font-size="14">Terminal</text>
  <rect x="12" y="638" width="196" height="30" rx="6" fill="#121212" stroke="#303834"/>
  <text x="42" y="658" fill="#d8e5df" font-family="Fira Code, Consolas, monospace" font-size="13">Logout</text>

  <rect x="245" y="24" width="1125" height="66" rx="8" fill="url(#panel)" stroke="#2a3b35"/>
  <text x="265" y="47" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="13">Active operator</text>
  <text x="265" y="70" fill="white" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">student</text>
  <rect x="1230" y="46" width="54" height="22" rx="6" fill="#063417" stroke="#078d32"/>
  <text x="1241" y="61" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700">150 PTS</text>
  <rect x="1294" y="46" width="74" height="22" rx="6" fill="#2b2108" stroke="#9b7813"/>
  <text x="1306" y="61" fill="#ffcf5a" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700">3 DAY</text>

  <rect x="245" y="108" width="665" height="540" rx="8" fill="url(#panel)" stroke="#25473e"/>
  <rect x="260" y="125" width="44" height="22" rx="5" fill="#063417" stroke="#078d32"/>
  <text x="270" y="140" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700">EASY</text>
  <rect x="312" y="125" width="132" height="22" rx="5" fill="#16211e" stroke="#384942"/>
  <text x="322" y="140" fill="white" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700">LINUX FUNDAMENTALS</text>
  <rect x="452" y="125" width="64" height="22" rx="5" fill="#07252d" stroke="#138aa1"/>
  <text x="462" y="140" fill="#38e8ff" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700">RUNNING</text>
  <text x="260" y="174" fill="white" font-family="Fira Code, Consolas, monospace" font-size="24" font-weight="800">Linux Basic Foothold</text>
  <text x="260" y="202" fill="#dcece6" font-family="Inter, Arial, sans-serif" font-size="15">Enumerate SSH, identify weak credentials, and abuse a deliberately misconfigured sudo rule.</text>
  <rect x="260" y="228" width="145" height="22" rx="5" fill="#281943" stroke="#8e61d3"/>
  <text x="270" y="243" fill="#c084fc" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700">FLAGFOUNDRY/LINUX-BASIC</text>
  <rect x="414" y="228" width="54" height="22" rx="5" fill="#063417" stroke="#078d32"/>
  <text x="425" y="243" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700">120 PTS</text>
  <rect x="792" y="150" width="85" height="34" rx="7" fill="#2b0c0c" stroke="#b73232"/>
  <text x="829" y="172" fill="#ff3333" font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">Stop</text>

  <rect x="260" y="272" width="630" height="35" rx="6" fill="#070a09" stroke="#223a33"/>
  <text x="274" y="295" fill="white" font-family="Fira Code, Consolas, monospace" font-size="13">Lab is running. Reopen the terminal if it was already connected.</text>

  <rect x="260" y="330" width="630" height="100" rx="8" fill="#07351a" fill-opacity=".6" stroke="#078d32"/>
  <text x="274" y="354" fill="#b8c7c1" font-family="Fira Code, Consolas, monospace" font-size="11">TARGET IP</text>
  <text x="274" y="376" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="22" font-weight="800">10.11.0.20</text>
  <text x="580" y="354" fill="#b8c7c1" font-family="Fira Code, Consolas, monospace" font-size="11">KALI IP</text>
  <text x="580" y="376" fill="white" font-family="Fira Code, Consolas, monospace" font-size="22" font-weight="800">10.11.0.10</text>
  <rect x="274" y="392" width="292" height="30" rx="6" fill="#07100d" stroke="#244039"/>
  <text x="288" y="412" fill="white" font-family="Fira Code, Consolas, monospace" font-size="13">nmap -sV 10.11.0.20</text>
  <text x="530" y="412" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="12">copy</text>
  <rect x="578" y="392" width="292" height="30" rx="6" fill="#07100d" stroke="#244039"/>
  <text x="592" y="412" fill="white" font-family="Fira Code, Consolas, monospace" font-size="13">ssh trainee@10.11.0.20</text>
  <text x="834" y="412" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="12">copy</text>

  <rect x="260" y="448" width="630" height="170" rx="8" fill="#07351a" fill-opacity=".58" stroke="#078d32"/>
  <text x="274" y="476" fill="white" font-family="Fira Code, Consolas, monospace" font-size="17" font-weight="800">1. Recon the host</text>
  <text x="274" y="496" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700">COMPLETED</text>
  <rect x="808" y="462" width="66" height="34" rx="7" fill="#07351a" stroke="#078d32"/>
  <text x="841" y="484" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">Done</text>
  <text x="274" y="522" fill="#e4f3ed" font-family="Inter, Arial, sans-serif" font-size="14">Your target IP appears in the room panel after you click Start. Run nmap -sV 10.11.0.20.</text>
  <rect x="274" y="548" width="600" height="52" rx="7" fill="#083c3d" fill-opacity=".45" stroke="#1a7174"/>
  <text x="288" y="573" fill="white" font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="700">Hint 1</text>
  <text x="288" y="592" fill="#dcece6" font-family="Inter, Arial, sans-serif" font-size="13">Start with enumeration and write down exact versions.</text>

  <rect x="922" y="108" width="448" height="142" rx="8" fill="url(#panel)" stroke="#25473e"/>
  <text x="940" y="140" fill="white" font-family="Fira Code, Consolas, monospace" font-size="18" font-weight="800">Submit flag</text>
  <rect x="940" y="160" width="410" height="36" rx="7" fill="#070a09" stroke="#223a33"/>
  <text x="952" y="183" fill="#bcd7cf" font-family="Fira Code, Consolas, monospace" font-size="14">FLAG{...}</text>
  <rect x="940" y="206" width="410" height="34" rx="7" fill="#063417" stroke="#078d32"/>
  <text x="1145" y="228" fill="#00ff41" font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="800" text-anchor="middle">Validate</text>

  <rect x="922" y="264" width="448" height="212" rx="8" fill="url(#panel)" stroke="#25473e"/>
  <rect x="940" y="278" width="410" height="178" fill="#020302" stroke="#13201b"/>
  <text x="958" y="305" fill="#ff4d4d" font-family="Fira Code, Consolas, monospace" font-size="13">(root@kali)-[~]</text>
  <text x="958" y="326" fill="#ff3333" font-family="Fira Code, Consolas, monospace" font-size="16">#</text>

  <rect x="922" y="490" width="448" height="158" rx="8" fill="url(#panel)" stroke="#25473e"/>
  <text x="940" y="522" fill="white" font-family="Fira Code, Consolas, monospace" font-size="18" font-weight="800">Writeup</text>
  <rect x="940" y="540" width="410" height="34" rx="7" fill="#070a09" stroke="#223a33"/>
  <text x="952" y="562" fill="#bcd7cf" font-family="Inter, Arial, sans-serif" font-size="14">Title</text>
