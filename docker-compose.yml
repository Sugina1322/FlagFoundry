services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hackme
      POSTGRES_PASSWORD: hackme
      POSTGRES_DB: hackme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackme"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://hackme:hackme@postgres:5432/hackme?schema=public
      JWT_SECRET: change-me-in-production
      FRONTEND_ORIGIN: http://localhost:5173
      DOCKER_SOCKET: /var/run/docker.sock
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./vpn:/app/vpn
      - ./db:/app/db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_WS_URL: ws://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
